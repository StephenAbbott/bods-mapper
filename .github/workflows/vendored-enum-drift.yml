name: Vendored enum drift

# Fails the build if the vendored Companies House nature/super-secure
# descriptions have drifted from upstream (companieshouse/api-enumerations).
# Runs on every push/PR, and weekly so upstream changes are caught even when
# nobody has pushed. To fix a failure, run the script locally (without --check)
# and commit the regenerated src/bods_mapper/natures_data.py.
on:
  push:
  pull_request:
  schedule:
    - cron: "0 6 * * 1" # Mondays 06:00 UTC

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Nature/super-secure enums (psc_descriptions.yml) up to date
        run: python scripts/revendor_natures.py --check
